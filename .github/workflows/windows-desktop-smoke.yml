name: windows-desktop-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - ci/windows-desktop-smoke

jobs:
  desktop-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare CI credentials (runtime-generated, masked)
        shell: pwsh
        run: |
          $np = 'Ci!' + (-join ((48..57) + (65..90) + (97..122) | Get-Random -Count 12 | ForEach-Object { [char]$_ }))
          "CI_NEWPASS=$np" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DEFAULT_PASS=admin123" | Out-File -FilePath $env:GITHUB_ENV -Append
          "::add-mask::$np"
          "::add-mask::admin123"

      - name: First-launch proof — fresh tree via the real start.bat
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          if ((Test-Path node_modules) -or (Test-Path .next)) { throw 'tree not fresh' }
          Write-Host 'FIRST_RUN_CLEAN'
          Start-Process cmd.exe -ArgumentList '/c start.bat > logs\first-launch.out 2>&1' -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-WebRequest -Uri 'http://localhost:3000/login' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match 'dir="rtl"') { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) { Get-Content logs/first-launch.out -Tail 80; throw 'first launch did not boot' }
          Write-Host 'FIRST_LAUNCH_OK'
          taskkill /F /IM node.exe 2>$null | Out-Null

      - name: Install Playwright chromium
        shell: pwsh
        run: |
          npm i --no-save playwright
          npx playwright install chromium

      - name: UI proof phase 1 — login, forced password change, create tenant (real Chromium)
        shell: pwsh
        run: |
          Start-Process cmd.exe -ArgumentList '/c npm start > logs\ui-server-1.out 2>&1' -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -Uri 'http://localhost:3000/login' -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Get-Content logs/ui-server-1.out -Tail 60; throw 'server did not boot for phase1' }
          node .github/ci/ui-proof.mjs phase1
          if ($LASTEXITCODE -ne 0) { throw 'ui-proof phase1 failed' }
          taskkill /F /IM node.exe 2>$null | Out-Null

      - name: UI proof phase 2 — restart persistence (data + session)
        shell: pwsh
        run: |
          Start-Process cmd.exe -ArgumentList '/c npm start > logs\ui-server-2.out 2>&1' -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -Uri 'http://localhost:3000/login' -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Get-Content logs/ui-server-2.out -Tail 60; throw 'server did not boot for phase2' }
          node .github/ci/ui-proof.mjs phase2
          if ($LASTEXITCODE -ne 0) { throw 'ui-proof phase2 failed' }
          taskkill /F /IM node.exe 2>$null | Out-Null

      - name: update.bat branch — rebuild keeps data and backups
        shell: cmd
        run: |
          taskkill /F /IM node.exe 2>nul
          cmd /c "update.bat < nul > logs\update.out 2>&1"
          if errorlevel 1 (type logs\update.out & exit /b 1)
          echo UPDATE_REBUILD_OK

      - name: UI proof phase 3 — tenant survives update.bat rebuild
        shell: pwsh
        run: |
          Start-Process cmd.exe -ArgumentList '/c npm start > logs\ui-server-3.out 2>&1' -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -Uri 'http://localhost:3000/login' -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Get-Content logs/ui-server-3.out -Tail 60; throw 'server did not boot for phase3' }
          node .github/ci/ui-proof.mjs phase3
          if ($LASTEXITCODE -ne 0) { throw 'ui-proof phase3 failed' }
          Write-Host 'UPDATE_OK'
          taskkill /F /IM node.exe 2>$null | Out-Null

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          taskkill /F /IM node.exe 2>$null | Out-Null
          if (Test-Path state) { Remove-Item -Recurse -Force state }
          exit 0

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-proof
          path: |
            shots/
            logs/
          retention-days: 7
